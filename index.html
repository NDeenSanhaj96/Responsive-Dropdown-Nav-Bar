<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Dropdown Nav Bar</title>
  </head>
  <body>
    <header class="navbar__container">
      <a href="#work"
        ><img class="navbar__logo" src="Images/logo.png" alt="Logo image"
      /></a>
      <nav class="navbar__menu">
        <ul class="navbar__links">
          <li class="navbar__link"><a href="">Work</a></li>
          <li class="navbar__link"><a href="">About</a></li>
          <li class="navbar__link">
            <select name="services" id="services">
              <option value="">Services</option>
              <option value="branding"><a href="#branding"></a>Branding</option>
              <option value="digitalProducts">
                <a href="#digitalProducts">Digital Products</a>
              </option>
              <option value="websites"><a href="#websites">Websites</a></option>
              <option value="content"><a href="#content">Content</a></option>
              <option value="development">
                <a href="#development">Development</a>
              </option>
              <option value="sourcecode">
                <a href="#sourceCode">Digital Apps SourceCode</a>
              </option>
            </select>
          </li>
          <li class="navbar__link"><a href="">Contact</a></li>
          <li class="navbar__link"><a href="">Blog</a></li>
        </ul>
        <a href="#" class="navbar__cta">Let's Talk</a>
      </nav>
      <input type="search" class="navbar__search" placeholder="search here" />
      <button class="navbar__toggle">☰</button>
    </header>
    <main>
      <h1>Responsive Dropdown Nav Bar</h1>
      <pre>
                Fully Responsive across all different devices

                                    By

                            Nasir Kamil Datti
            </pre
      >
    </main>
    <script src="script.js"></script>
  </body>
</html>
