<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Dropdown Nav Bar</title>
  </head>
  <body>
    <header class="navbar__container">
      <a href="#work"
        ><img class="navbar__logo" src="Images/logo.png" alt="Logo image"
      /></a>
      <nav class="navbar__menu">
        <ul class="navbar__links">
          <li class="navbar__link"><a href="">Work</a></li>
          <li class="navbar__link"><a href="">About</a></li>
          <li class="navbar__link"><a href="">Contact</a></li>
          <li class="navbar__link"><a href="">Blog</a></li>
          <li class="navbar__link select">
            <button
              type="button"
              class="select__trigger"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span>Services</span>
              <span class="arrow">▽</span>
            </button>
            <ul class="select__options" role="listbox" tabindex="-1">
              <li role="option" data-target="#branding"></li>
              <li role="option" data-target="#digitalApps">Digital Apps</li>
              <li role="option" data-target="#websites">Websites</li>
              <li role="option" data-target="#devs">Developments</li>
              <li role="option" data-target="#srcCode">Source Codes</li>
            </ul>
          </li>
        </ul>
      </nav>
      <input type="search" class="navbar__search" placeholder="search here" />
      <a href="#" class="navbar__cta">Let's Talk</a>
      <button class="navbar__toggle">✕☰</button>
    </header>
    <main>
      <h1 class="main__heading">Responsive Dropdown Nav Bar</h1>
      <div class="description">
        <p>Fully Responsive across different devices</p>
        <p>By</p>
        <p>Nasir Kamil Datti</p>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
